    <rect x="180" y="817" width="150" height="43" rx="12" fill="#fff" stroke="#B8D4C9" stroke-width="1.5"/><text x="255" y="844" text-anchor="middle" font-size="13" font-weight="700" class="dark">← Volver</text>
    <rect x="1090" y="817" width="170" height="43" rx="12" fill="#0F766E"/><text x="1175" y="844" text-anchor="middle" font-size="13" font-weight="700" class="white">Continuar →</text>
    <text x="90" y="875" font-size="11" class="muted">MOCKUP · ESCRITORIO · PASO 2</text>
  </g>

  <!-- Step 3: Owner details and review -->
  <g transform="translate(0 1800)">
    <rect width="1440" height="880" class="canvas"/><rect width="1440" height="78" class="bar"/><line x1="0" y1="77" x2="1440" y2="77" stroke="#E2EBE6"/>
    <text x="86" y="49" font-size="20" font-weight="800">Patitas <tspan fill="#0F766E">Felices</tspan></text><text x="383" y="48" font-size="14" class="muted">← Volver al inicio</text>
    <rect x="1084" y="18" width="264" height="44" rx="22" fill="#FFF1EF" stroke="#F2D1CC"/><circle cx="1107" cy="40" r="8" fill="#B42318"/><text x="1124" y="45" font-size="13" font-weight="700" fill="#8F2118">¿Emergencia? Llamar / WhatsApp</text>
    <text x="180" y="111" class="small muted" font-weight="700" letter-spacing="1">AGENDAR CITA</text><line x1="180" y1="145" x2="1260" y2="145" stroke="#0F766E" stroke-width="4"/><circle cx="180" cy="145" r="13" fill="#0F766E"/><circle cx="720" cy="145" r="13" fill="#0F766E"/><circle cx="1260" cy="145" r="13" fill="#0F766E"/>
    <text x="180" y="176" class="step muted">1 · Mascota y motivo</text><text x="720" y="176" text-anchor="middle" class="step muted">2 · Fecha y hora</text><text x="1260" y="176" text-anchor="end" class="step teal">3 · Tus datos</text>
    <text x="180" y="222" font-size="30" font-weight="800" class="dark">¿Cómo podemos contactarte?</text><text x="180" y="251" class="body muted">Revisa los datos de tu cita antes de confirmarla.</text>
    <rect x="180" y="274" width="650" height="420" rx="22" class="card"/>
    <text x="212" y="317" class="label">Nombre completo <tspan fill="#B42318">*</tspan></text><rect x="212" y="331" width="586" height="50" rx="9" class="field"/><text x="232" y="362" class="small muted">Escribe tu nombre</text>
    <text x="212" y="420" class="label">Teléfono <tspan fill="#B42318">*</tspan></text><rect x="212" y="434" width="586" height="50" rx="9" class="field"/><text x="232" y="465" class="small muted">Número para confirmar o aclarar la cita</text>
    <circle cx="224" cy="520" r="12" fill="#E6F4EA"/><path d="M219 520l4 4 7-8" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
