    <rect x="710" y="660" width="340" height="52" rx="14" fill="#fff" stroke="#B8D4C9" stroke-width="1.5"/><text x="880" y="692" text-anchor="middle" font-size="13" font-weight="700" class="dark">Compartir por WhatsApp</text>
    <text x="720" y="758" text-anchor="middle" class="small muted">Dirección, horario e instrucciones se completarán con datos de la clínica.</text>
    <text x="720" y="810" text-anchor="middle" font-size="13" font-weight="700" class="teal">Volver al inicio →</text>
    <text x="90" y="861" font-size="11" class="muted">MOCKUP · ESCRITORIO · CONFIRMACIÓN</text>
