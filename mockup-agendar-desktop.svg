    <line x1="212" y1="550" x2="798" y2="550" stroke="#E5ECE8"/><text x="212" y="582" font-size="11" class="muted">* Datos obligatorios · Aviso de privacidad pendiente de validación</text>
    <rect x="870" y="274" width="390" height="420" rx="22" class="card"/>
    <text x="902" y="317" class="label dark">Resumen de la cita</text><line x1="902" y1="337" x2="1228" y2="337" stroke="#E5ECE8"/>
    <text x="902" y="374" class="small muted">Mascota</text><text x="902" y="398" class="small" font-weight="700">[Especie] · [Nombre opcional]</text><text x="902" y="419" class="small muted">Edad: [opcional]</text>
    <text x="902" y="458" class="small muted">Motivo</text><text x="902" y="482" class="small">[Motivo de la cita]</text>
    <text x="902" y="521" class="small muted">Fecha y hora</text><text x="902" y="545" class="small">[Fecha] · [Hora]</text>
    <text x="902" y="584" class="small muted">Clínica</text><text x="902" y="608" class="small">Patitas Felices · [Dirección]</text>
    <rect x="902" y="632" width="326" height="38" rx="11" fill="#F5FAF7"/><text x="1065" y="656" text-anchor="middle" font-size="11" class="muted">Puedes volver y editar sin perder tus datos.</text>
    <rect x="180" y="744" width="150" height="44" rx="12" fill="#fff" stroke="#B8D4C9" stroke-width="1.5"/><text x="255" y="772" text-anchor="middle" font-size="13" font-weight="700" class="dark">← Volver</text>
    <rect x="660" y="744" width="170" height="44" rx="12" fill="#0F766E"/><text x="745" y="772" text-anchor="middle" font-size="13" font-weight="700" class="white">Confirmar cita</text>
    <text x="90" y="861" font-size="11" class="muted">MOCKUP · ESCRITORIO · PASO 3</text>
  </g>

  <!-- Confirmation -->
  <g transform="translate(0 2700)">
    <rect width="1440" height="880" class="canvas"/><rect width="1440" height="78" class="bar"/><line x1="0" y1="77" x2="1440" y2="77" stroke="#E2EBE6"/>
    <text x="86" y="49" font-size="20" font-weight="800">Patitas <tspan fill="#0F766E">Felices</tspan></text><text x="1084" y="48" font-size="13" font-weight="700" fill="#8F2118">¿Necesitas ayuda? Llamar / WhatsApp</text>
    <circle cx="720" cy="190" r="38" fill="#DDF2E8"/><path d="M701 190l13 13 26-29" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
