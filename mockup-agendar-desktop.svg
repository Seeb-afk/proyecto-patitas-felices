    <text x="86" y="49" font-size="20" font-weight="800">Patitas <tspan fill="#0F766E">Felices</tspan></text><text x="383" y="48" font-size="14" class="muted">← Volver al inicio</text>
    <rect x="1084" y="18" width="264" height="44" rx="22" fill="#FFF1EF" stroke="#F2D1CC"/><circle cx="1107" cy="40" r="8" fill="#B42318"/><text x="1124" y="45" font-size="13" font-weight="700" fill="#8F2118">¿Emergencia? Llamar / WhatsApp</text>
    <text x="180" y="111" class="small muted" font-weight="700" letter-spacing="1">AGENDAR CITA</text><line x1="180" y1="145" x2="1260" y2="145" stroke="#D8E3DD" stroke-width="4"/><line x1="180" y1="145" x2="720" y2="145" stroke="#0F766E" stroke-width="4"/><circle cx="180" cy="145" r="13" fill="#0F766E"/><circle cx="720" cy="145" r="13" fill="#0F766E"/><circle cx="1260" cy="145" r="13" fill="#fff" stroke="#B9C9C1" stroke-width="3"/>
    <text x="180" y="176" class="step muted">1 · Mascota y motivo</text><text x="720" y="176" text-anchor="middle" class="step teal">2 · Fecha y hora</text><text x="1260" y="176" text-anchor="end" class="step muted">3 · Tus datos</text>
    <text x="180" y="222" font-size="30" font-weight="800" class="dark">Elige fecha y hora</text><text x="180" y="251" class="body muted">Solo verás opciones disponibles para la clínica.</text>
    <rect x="180" y="274" width="650" height="520" rx="22" class="card"/>
    <text x="212" y="316" class="label">Fecha de la cita</text><text x="510" y="316" text-anchor="middle" font-size="15" font-weight="700" class="dark">[Mes / año]</text>
    <circle cx="770" cy="311" r="16" fill="#F2F7F4"/><path d="M774 305l-6 6 6 6" fill="none" stroke="#58716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="803" cy="311" r="16" fill="#F2F7F4"/><path d="M799 305l6 6-6 6" fill="none" stroke="#58716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="212" y1="342" x2="798" y2="342" stroke="#E5ECE8"/>
    <g font-size="12" class="muted" text-anchor="middle"><text x="252" y="376">L</text><text x="332" y="376">M</text><text x="412" y="376">M</text><text x="492" y="376">J</text><text x="572" y="376">V</text><text x="652" y="376">S</text><text x="732" y="376">D</text></g>
    <g font-size="13" text-anchor="middle" class="dark">
      <text x="252" y="423">1</text><text x="332" y="423">2</text><text x="412" y="423">3</text><text x="492" y="423">4</text><text x="572" y="423">5</text><text x="652" y="423">6</text><text x="732" y="423">7</text>
      <text x="252" y="471">8</text><text x="332" y="471">9</text><text x="412" y="471">10</text><text x="492" y="471">11</text><text x="572" y="471">12</text><text x="652" y="471">13</text><text x="732" y="471">14</text>
      <text x="252" y="519">15</text><text x="332" y="519">16</text><text x="412" y="519">17</text><text x="492" y="519">18</text><text x="572" y="519">19</text><text x="652" y="519">20</text><text x="732" y="519">21</text>
      <text x="252" y="567">22</text><text x="332" y="567">23</text><text x="412" y="567">24</text><text x="492" y="567">25</text><text x="572" y="567">26</text><text x="652" y="567">27</text><text x="732" y="567">28</text>
      <text x="252" y="615">29</text><text x="332" y="615">30</text><text x="412" y="615">31</text>
    </g>
    <circle cx="492" cy="561" r="21" fill="#0F766E"/><text x="492" y="566" text-anchor="middle" font-size="13" font-weight="700" class="white">25</text>
    <text x="212" y="668" font-size="11" class="muted">Fechas ilustrativas. La disponibilidad debe actualizarse en tiempo real.</text>
    <text x="212" y="709" class="small muted">Fecha seleccionada</text><text x="212" y="734" class="label dark">[Día / mes / año]</text>
    <rect x="855" y="274" width="405" height="328" rx="22" class="card"/>
    <text x="885" y="316" class="label">Horarios disponibles</text><text x="885" y="340" class="small muted">Elige una hora para continuar.</text>
    <rect x="885" y="363" width="158" height="48" rx="12" fill="#0F766E"/><text x="964" y="393" text-anchor="middle" font-size="13" font-weight="700" class="white">[10:00 a. m.]</text>
    <rect x="1057" y="363" width="173" height="48" rx="12" fill="#F5FAF7" stroke="#B8D4C9"/><text x="1143" y="393" text-anchor="middle" font-size="13" font-weight="700" class="dark">[11:30 a. m.]</text>
    <rect x="885" y="425" width="158" height="48" rx="12" fill="#F5FAF7" stroke="#B8D4C9"/><text x="964" y="455" text-anchor="middle" font-size="13" font-weight="700" class="dark">[2:00 p. m.]</text>
    <rect x="1057" y="425" width="173" height="48" rx="12" fill="#F5FAF7" stroke="#B8D4C9"/><text x="1143" y="455" text-anchor="middle" font-size="13" font-weight="700" class="dark">[3:30 p. m.]</text>
    <text x="885" y="511" font-size="11" class="muted">Horarios mostrados como ejemplo.</text><text x="885" y="535" font-size="11" class="muted">Si uno se ocupa, podrás elegir otro.</text>
    <rect x="855" y="622" width="405" height="172" rx="22" fill="#F5FAF7" stroke="#DCE9E2"/>
