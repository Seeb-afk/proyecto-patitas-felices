<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3600" viewBox="0 0 1440 3600" preserveAspectRatio="xMidYMid meet" overflow="hidden" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
  <title id="title">Mockup del flujo de citas — escritorio</title>
  <desc id="desc">Cuatro pantallas de alta fidelidad para solicitar una cita veterinaria en Patitas Felices.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#174E49" flood-opacity=".09"/></filter>
    <linearGradient id="softBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FBF8"/><stop offset="1" stop-color="#EAF5EF"/></linearGradient>
    <style>
      text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#243431}.dark{fill:#134E4A}.teal{fill:#0F766E}.muted{fill:#58716C}.white{fill:#fff}.urgent{fill:#B42318}
      .canvas{fill:#F4F7F5}.bar{fill:#fff}.card{fill:#fff;stroke:#E0EAE5;stroke-width:1.5;filter:url(#shadow)}
      .field{fill:#fff;stroke:#BCCBC4;stroke-width:1.4}.soft{fill:#F5FAF7}.label{font-size:14px;font-weight:700}.small{font-size:12px}.body{font-size:16px}.step{font-size:12px;font-weight:700}
    </style>
  </defs>
  <rect width="1440" height="3600" fill="#E9EFEC"/>

  <!-- Step 1: Pet and reason -->
  <g>
    <rect width="1440" height="880" class="canvas"/>
    <rect width="1440" height="78" class="bar"/><line x1="0" y1="77" x2="1440" y2="77" stroke="#E2EBE6"/>
    <g transform="translate(86 21)" fill="#0F766E"><ellipse cx="18" cy="25" rx="11" ry="9"/><ellipse cx="7" cy="11" rx="5" ry="7"/><ellipse cx="18" cy="5" rx="5" ry="7"/><ellipse cx="29" cy="11" rx="5" ry="7"/></g>
    <text x="127" y="49" font-size="20" font-weight="800">Patitas <tspan fill="#0F766E">Felices</tspan></text>
    <text x="383" y="48" font-size="14" class="muted">← Volver al inicio</text>
    <rect x="1084" y="18" width="264" height="44" rx="22" fill="#FFF1EF" stroke="#F2D1CC"/>
    <circle cx="1107" cy="40" r="8" fill="#B42318"/><text x="1124" y="45" font-size="13" font-weight="700" fill="#8F2118">¿Emergencia? Llamar / WhatsApp</text>
    <text x="180" y="111" class="small muted" font-weight="700" letter-spacing="1">AGENDAR CITA</text>
    <line x1="180" y1="145" x2="1260" y2="145" stroke="#D8E3DD" stroke-width="4"/><line x1="180" y1="145" x2="540" y2="145" stroke="#0F766E" stroke-width="4"/>
    <circle cx="180" cy="145" r="13" fill="#0F766E"/><circle cx="720" cy="145" r="13" fill="#fff" stroke="#B9C9C1" stroke-width="3"/><circle cx="1260" cy="145" r="13" fill="#fff" stroke="#B9C9C1" stroke-width="3"/>
    <text x="180" y="176" class="step teal">1 · Mascota y motivo</text><text x="720" y="176" text-anchor="middle" class="step muted">2 · Fecha y hora</text><text x="1260" y="176" text-anchor="end" class="step muted">3 · Tus datos</text>
    <text x="180" y="222" font-size="30" font-weight="800" class="dark">Cuéntanos sobre tu mascota</text><text x="180" y="251" class="body muted">Completa lo esencial para encontrar una cita adecuada.</text>
    <rect x="180" y="274" width="760" height="514" rx="22" class="card"/>
    <text x="212" y="315" class="label">Especie <tspan fill="#B42318">*</tspan></text>
    <rect x="212" y="329" width="696" height="48" rx="9" class="field"/><text x="230" y="359" class="body muted">Selecciona una especie</text><text x="882" y="359" class="body muted">⌄</text>
    <text x="230" y="394" font-size="11" class="muted">Perro · Gato · Ave · Conejo/roedor · Reptil · Otro</text>
    <text x="212" y="433" class="label">Nombre de la mascota <tspan class="muted" font-weight="400">(opcional)</tspan></text>
    <rect x="212" y="447" width="420" height="48" rx="9" class="field"/><text x="230" y="477" class="small muted">Escribe su nombre si lo deseas</text>
    <text x="654" y="433" class="label">Edad <tspan class="muted" font-weight="400">(opcional)</tspan></text>
    <rect x="654" y="447" width="254" height="48" rx="9" class="field"/><text x="672" y="477" class="small muted">Años o meses</text><text x="882" y="477" class="small muted">⌄</text>
    <text x="212" y="535" class="label">Motivo de la cita <tspan fill="#B42318">*</tspan></text>
    <rect x="212" y="549" width="696" height="48" rx="9" class="field"/><text x="230" y="579" class="body muted">Selecciona el motivo</text><text x="882" y="579" class="body muted">⌄</text>
    <text x="230" y="614" font-size="11" class="muted">Consulta · Vacunación · Desparasitación · Peluquería · Cirugía · Seguimiento · Otro</text>
    <text x="212" y="652" class="label">Síntomas o condición médica <tspan class="muted" font-weight="400">(opcional)</tspan></text>
    <rect x="212" y="666" width="696" height="68" rx="9" class="field"/><text x="230" y="695" class="small muted">Añade información importante para el equipo veterinario.</text>
    <text x="212" y="761" font-size="11" class="muted"><tspan fill="#B42318">*</tspan> Campos obligatorios. Si eliges «Otro», podrás especificar el motivo.</text>
    <rect x="212" y="776" width="145" height="42" rx="12" fill="#fff" stroke="#B8D4C9" stroke-width="1.5"/><text x="284" y="802" text-anchor="middle" font-size="13" font-weight="700" class="dark">Cancelar</text>
    <rect x="738" y="776" width="170" height="42" rx="12" fill="#0F766E"/><text x="823" y="802" text-anchor="middle" font-size="13" font-weight="700" class="white">Continuar →</text>
    <rect x="970" y="274" width="290" height="222" rx="20" class="card"/>
    <circle cx="1010" cy="317" r="20" fill="#E6F4EA"/><path d="M1002 317h16m-8-8v16" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/>
    <text x="1042" y="322" class="label dark">Una sola clínica</text><text x="1000" y="364" class="small muted">No necesitas elegir sede.</text><text x="1000" y="387" class="small muted">Te mostraremos los detalles</text><text x="1000" y="410" class="small muted">de ubicación al confirmar.</text>
    <line x1="1000" y1="432" x2="1230" y2="432" stroke="#E1EAE5"/><text x="1000" y="464" font-size="11" class="muted">Nombre y edad de la mascota son opcionales.</text>
    <rect x="970" y="520" width="290" height="166" rx="20" fill="#FFF4F2" stroke="#F2D1CC"/>
    <circle cx="1008" cy="558" r="16" fill="#F9DEDA"/><path d="M1002 552c2 7 5 10 11 11l3-4-5-3-3 2c-2-1-3-2-4-4l2-3-3-4z" fill="#B42318"/>
    <text x="1034" y="562" font-size="14" font-weight="800" fill="#8F2118">¿Necesitas ayuda urgente?</text><text x="1000" y="596" class="small" fill="#7D5652">Llama o escribe por WhatsApp.</text>
    <rect x="1000" y="620" width="230" height="42" rx="12" fill="#B42318"/><text x="1115" y="646" text-anchor="middle" font-size="12" font-weight="700" class="white">Contactar a la clínica</text>
    <text x="90" y="861" font-size="11" class="muted">MOCKUP · ESCRITORIO · PASO 1</text>
  </g>

  <!-- Step 2: Date and time -->
  <g transform="translate(0 900)">
