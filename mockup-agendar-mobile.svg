    <rect x="20" y="230" width="350" height="222" rx="18" class="card"/>
    <text x="38" y="266" class="label">Nombre completo <tspan fill="#B42318">*</tspan></text><rect x="38" y="278" width="314" height="44" rx="9" class="field"/><text x="52" y="306" class="small muted">Escribe tu nombre</text>
