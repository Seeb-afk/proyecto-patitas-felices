    <text x="18" y="40" font-size="15" font-weight="800">Patitas <tspan fill="#0F766E">Felices</tspan></text><rect x="232" y="14" width="144" height="36" rx="18" fill="#FFF1EF" stroke="#F2D1CC"/><circle cx="249" cy="32" r="5" fill="#B42318"/><text x="261" y="36" font-size="10" font-weight="700" fill="#8F2118">¿Emergencia?</text>
    <circle cx="195" cy="140" r="32" fill="#DDF2E8"/><path d="M179 140l11 11 22-24" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="195" y="203" text-anchor="middle" font-size="24" font-weight="800" class="dark">¡Cita confirmada!</text><text x="195" y="229" text-anchor="middle" class="small muted">Te enviaremos los detalles al teléfono indicado.</text>
