    <rect x="20" y="582" width="164" height="42" rx="11" fill="#0F766E"/><text x="102" y="608" text-anchor="middle" font-size="12" font-weight="700" class="white">[10:00 a. m.]</text>
    <rect x="206" y="582" width="164" height="42" rx="11" fill="#fff" stroke="#B8D4C9"/><text x="288" y="608" text-anchor="middle" font-size="12" font-weight="700" class="dark">[11:30 a. m.]</text>
    <rect x="20" y="634" width="164" height="42" rx="11" fill="#fff" stroke="#B8D4C9"/><text x="102" y="660" text-anchor="middle" font-size="12" font-weight="700" class="dark">[2:00 p. m.]</text>
    <rect x="206" y="634" width="164" height="42" rx="11" fill="#fff" stroke="#B8D4C9"/><text x="288" y="660" text-anchor="middle" font-size="12" font-weight="700" class="dark">[3:30 p. m.]</text>
