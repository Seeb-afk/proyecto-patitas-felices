    <text x="20" y="92" font-size="10" class="muted" font-weight="700" letter-spacing=".5">AGENDAR CITA</text><line x1="25" y1="117" x2="365" y2="117" stroke="#D8E3DD" stroke-width="3"/><line x1="25" y1="117" x2="280" y2="117" stroke="#0F766E" stroke-width="3"/><circle cx="25" cy="117" r="9" fill="#0F766E"/><circle cx="195" cy="117" r="9" fill="#0F766E"/><circle cx="365" cy="117" r="9" fill="#fff" stroke="#B9C9C1" stroke-width="2"/>
