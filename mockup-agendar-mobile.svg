    <text x="18" y="40" font-size="15" font-weight="800">Patitas <tspan fill="#0F766E">Felices</tspan></text><rect x="232" y="14" width="144" height="36" rx="18" fill="#FFF1EF" stroke="#F2D1CC"/><circle cx="249" cy="32" r="5" fill="#B42318"/><text x="261" y="36" font-size="10" font-weight="700" fill="#8F2118">¿Emergencia?</text>
    <text x="20" y="92" font-size="10" class="muted" font-weight="700" letter-spacing=".5">AGENDAR CITA</text><line x1="25" y1="117" x2="365" y2="117" stroke="#0F766E" stroke-width="3"/><circle cx="25" cy="117" r="9" fill="#0F766E"/><circle cx="195" cy="117" r="9" fill="#0F766E"/><circle cx="365" cy="117" r="9" fill="#0F766E"/>
    <text x="25" y="142" font-size="9" class="muted">Mascota</text><text x="195" y="142" text-anchor="middle" font-size="9" class="muted">Fecha</text><text x="365" y="142" text-anchor="end" font-size="9" font-weight="700" class="teal">Tus datos</text>
