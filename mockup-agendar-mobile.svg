<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3720" viewBox="0 0 390 3720" preserveAspectRatio="xMidYMid meet" overflow="hidden" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
  <title id="title">Mockup del flujo de citas — móvil</title>
  <desc id="desc">Cuatro pantallas móviles de alta fidelidad para solicitar una cita veterinaria en Patitas Felices.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#174E49" flood-opacity=".09"/></filter>
    <linearGradient id="softBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FBF8"/><stop offset="1" stop-color="#EAF5EF"/></linearGradient>
    <style>
      text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#243431}.dark{fill:#134E4A}.teal{fill:#0F766E}.muted{fill:#58716C}.white{fill:#fff}
      .canvas{fill:#F4F7F5}.bar{fill:#fff}.card{fill:#fff;stroke:#E0EAE5;stroke-width:1.2;filter:url(#shadow)}
      .field{fill:#fff;stroke:#BCCBC4;stroke-width:1.2}.label{font-size:12px;font-weight:700}.small{font-size:11px}.body{font-size:14px}
    </style>
  </defs>
  <rect width="390" height="3720" fill="#E9EFEC"/>

  <!-- Step 1: Pet and reason -->
  <g>
    <rect width="390" height="900" class="canvas"/><rect width="390" height="64" class="bar"/><line x1="0" y1="63" x2="390" y2="63" stroke="#E2EBE6"/>
    <g transform="translate(18 16)" fill="#0F766E"><ellipse cx="15" cy="21" rx="9" ry="7"/><ellipse cx="5" cy="10" rx="4" ry="5.5"/><ellipse cx="15" cy="5" rx="4" ry="5.5"/><ellipse cx="25" cy="10" rx="4" ry="5.5"/></g>
    <text x="52" y="40" font-size="15" font-weight="800">Patitas <tspan fill="#0F766E">Felices</tspan></text>
    <rect x="232" y="14" width="144" height="36" rx="18" fill="#FFF1EF" stroke="#F2D1CC"/><circle cx="249" cy="32" r="5" fill="#B42318"/><text x="261" y="36" font-size="10" font-weight="700" fill="#8F2118">¿Emergencia?</text>
    <text x="20" y="92" font-size="10" class="muted" font-weight="700" letter-spacing=".5">AGENDAR CITA</text><line x1="25" y1="117" x2="365" y2="117" stroke="#D8E3DD" stroke-width="3"/><line x1="25" y1="117" x2="195" y2="117" stroke="#0F766E" stroke-width="3"/><circle cx="25" cy="117" r="9" fill="#0F766E"/><circle cx="195" cy="117" r="9" fill="#fff" stroke="#B9C9C1" stroke-width="2"/><circle cx="365" cy="117" r="9" fill="#fff" stroke="#B9C9C1" stroke-width="2"/>
    <text x="25" y="142" font-size="9" font-weight="700" class="teal">Mascota</text><text x="195" y="142" text-anchor="middle" font-size="9" class="muted">Fecha</text><text x="365" y="142" text-anchor="end" font-size="9" class="muted">Tus datos</text>
    <text x="20" y="185" font-size="25" font-weight="800" class="dark">Datos de tu mascota</text><text x="20" y="210" class="small muted">Cuéntanos quién necesita atención.</text>
    <rect x="20" y="230" width="350" height="526" rx="18" class="card"/>
    <text x="38" y="264" class="label">Especie <tspan fill="#B42318">*</tspan></text><rect x="38" y="276" width="314" height="44" rx="9" class="field"/><text x="52" y="304" class="small muted">Selecciona una especie</text><text x="334" y="304" class="body muted">⌄</text>
    <text x="52" y="337" font-size="9" class="muted">Perro · Gato · Ave · Conejo/roedor · Reptil · Otro</text>
    <text x="38" y="373" class="label">Nombre de la mascota <tspan class="muted" font-weight="400">(opcional)</tspan></text><rect x="38" y="385" width="314" height="44" rx="9" class="field"/><text x="52" y="413" class="small muted">Escribe su nombre si lo deseas</text>
    <text x="38" y="465" class="label">Edad <tspan class="muted" font-weight="400">(opcional)</tspan></text><rect x="38" y="477" width="314" height="44" rx="9" class="field"/><text x="52" y="505" class="small muted">Años o meses</text>
    <text x="38" y="557" class="label">Motivo de la cita <tspan fill="#B42318">*</tspan></text><rect x="38" y="569" width="314" height="44" rx="9" class="field"/><text x="52" y="597" class="small muted">Selecciona el motivo</text><text x="334" y="597" class="body muted">⌄</text>
    <text x="52" y="629" font-size="9" class="muted">Consulta · vacuna · desparasitación · peluquería</text><text x="52" y="643" font-size="9" class="muted">Evaluación para cirugía · seguimiento · otro</text>
    <text x="38" y="675" class="label">Síntomas o condición médica <tspan class="muted" font-weight="400">(opcional)</tspan></text><rect x="38" y="687" width="314" height="48" rx="9" class="field"/><text x="52" y="716" font-size="10" class="muted">Añade información importante, si lo deseas.</text>
    <text x="20" y="778" font-size="10" class="muted"><tspan fill="#B42318">*</tspan> Obligatorio. «Otro» permite especificar el motivo.</text>
    <rect x="20" y="797" width="112" height="44" rx="12" fill="#fff" stroke="#B8D4C9"/><text x="76" y="824" text-anchor="middle" font-size="12" font-weight="700" class="dark">Cancelar</text>
    <rect x="216" y="797" width="154" height="44" rx="12" fill="#0F766E"/><text x="293" y="824" text-anchor="middle" font-size="12" font-weight="700" class="white">Continuar →</text>
    <text x="20" y="882" font-size="10" class="muted">MÓVIL · PASO 1</text>
  </g>

