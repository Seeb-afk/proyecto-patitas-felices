    <g font-size="10" text-anchor="middle">
      <text x="62" y="344">1</text><text x="106" y="344">2</text><text x="150" y="344">3</text><text x="194" y="344">4</text><text x="238" y="344">5</text><text x="282" y="344">6</text><text x="326" y="344">7</text>
      <text x="62" y="384">8</text><text x="106" y="384">9</text><text x="150" y="384">10</text><text x="194" y="384">11</text><text x="238" y="384">12</text><text x="282" y="384">13</text><text x="326" y="384">14</text>
      <text x="62" y="424">15</text><text x="106" y="424">16</text><text x="150" y="424">17</text><text x="194" y="424">18</text><text x="238" y="424">19</text><text x="282" y="424">20</text><text x="326" y="424">21</text>
      <text x="62" y="464">22</text><text x="106" y="464">23</text><text x="150" y="464">24</text><text x="194" y="464">25</text><text x="238" y="464">26</text><text x="282" y="464">27</text><text x="326" y="464">28</text>
