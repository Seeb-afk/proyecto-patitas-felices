<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2480" viewBox="0 0 1440 2480" preserveAspectRatio="xMidYMid meet" overflow="hidden" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
  <title id="title">Mockup de alta fidelidad — Patitas Felices, escritorio</title>
  <desc id="desc">Página principal de una clínica veterinaria, diseñada con teal y verde suave, en versión de escritorio.</desc>
