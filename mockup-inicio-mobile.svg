<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3320" viewBox="0 0 390 3320" preserveAspectRatio="xMidYMid meet" overflow="hidden" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
  <title id="title">Mockup de alta fidelidad — Patitas Felices, móvil</title>
  <desc id="desc">Página principal responsive de una clínica veterinaria en móvil, con paleta teal y verde suave.</desc>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FBF8"/><stop offset="1" stop-color="#E5F3EC"/></linearGradient>
    <linearGradient id="artBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DDF2E8"/><stop offset="1" stop-color="#F4F8EE"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#174E49" flood-opacity=".10"/></filter>
    <style>
