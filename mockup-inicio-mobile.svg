  <text x="22" y="199" font-size="32" font-weight="800" class="dark">profesional, con el</text>
  <text x="22" y="237" font-size="32" font-weight="800" class="dark">cuidado cercano que</text>
  <text x="22" y="275" font-size="32" font-weight="800" class="dark">tu mascota merece</text>
