      .muted{fill:#58716C}.teal{fill:#0F766E}.dark{fill:#134E4A}.white{fill:#fff}
      .small{font-size:12px}.body{font-size:15px}.iconStroke{fill:none;stroke:#0F766E;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .card{fill:#fff;stroke:#E4ECE8;stroke-width:1.2;filter:url(#shadow)}
