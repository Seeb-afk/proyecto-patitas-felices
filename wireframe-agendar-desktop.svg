    <text x="92" y="48" font-size="21" font-weight="700">PATITAS FELICES</text><text x="1060" y="47" font-size="14" font-weight="700">¿Emergencia? Llamar / WhatsApp</text><line x1="0" y1="76" x2="1440" y2="76" stroke="#C7CECF"/>
    <circle cx="720" cy="210" r="42" fill="#DDE2E3" stroke="#727C7F" stroke-width="2"/><path d="M700 210l14 14 27-31" fill="none" stroke="#465154" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="720" y="292" text-anchor="middle" font-size="34" font-weight="700">¡Tu cita está confirmada!</text><text x="720" y="327" text-anchor="middle" class="body muted">Guarda los detalles para tenerlos a mano.</text>
    <rect x="390" y="365" width="660" height="292" rx="14" class="panel"/>
    <text x="430" y="409" class="label">Resumen de tu cita</text><line x1="430" y1="427" x2="1010" y2="427" stroke="#D4D9DA"/>
    <text x="430" y="464" class="small muted">Mascota</text><text x="610" y="464" class="small" font-weight="700">[Especie] · [Nombre opcional] · [Edad opcional]</text>
    <text x="430" y="504" class="small muted">Motivo</text><text x="610" y="504" class="small">[Motivo]</text>
    <text x="430" y="544" class="small muted">Fecha y hora</text><text x="610" y="544" class="small">[Fecha] · [Hora]</text>
    <text x="430" y="584" class="small muted">Clínica</text><text x="610" y="584" class="small">Patitas Felices · [Dirección]</text>
    <text x="430" y="624" class="small muted">Contacto</text><text x="610" y="624" class="small">[Teléfono de la clínica]</text>
