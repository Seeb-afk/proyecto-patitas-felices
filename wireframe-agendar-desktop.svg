    <text x="912" y="446" class="small muted">Motivo</text><text x="912" y="469" class="small">[Motivo de la cita]</text>
    <text x="912" y="509" class="small muted">Fecha y hora</text><text x="912" y="532" class="small">[Fecha] · [Hora]</text>
    <text x="912" y="572" class="small muted">Clínica</text><text x="912" y="595" class="small">Patitas Felices · [dirección]</text>
    <text x="190" y="720" class="small muted">Al volver al paso anterior, tus datos se conservarán.</text>
    <rect x="190" y="817" width="160" height="45" rx="8" fill="#fff" stroke="#929B9D" stroke-width="1.5"/><text x="270" y="845" text-anchor="middle" class="small">← Volver</text>
    <rect x="670" y="817" width="170" height="45" rx="8" class="button"/><text x="755" y="845" text-anchor="middle" class="label">Confirmar cita</text>
    <text x="92" y="875" font-size="12" class="muted">WIREFRAME · DESKTOP 1440 PX · 3 / 4</text>
  </g>

  <!-- Screen 4: Confirmation -->
