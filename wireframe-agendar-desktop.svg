    <rect x="710" y="690" width="340" height="54" rx="9" class="button"/><text x="880" y="723" text-anchor="middle" class="label">Compartir por WhatsApp</text>
    <text x="720" y="792" text-anchor="middle" class="small muted">Dirección, horario e instrucciones se mostrarán al confirmarse con la clínica.</text>
    <text x="720" y="846" text-anchor="middle" class="small" font-weight="700">Volver al inicio</text>
    <text x="92" y="875" font-size="12" class="muted">WIREFRAME · DESKTOP 1440 PX · CONFIRMACIÓN</text>
