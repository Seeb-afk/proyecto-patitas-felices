<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3600" viewBox="0 0 1440 3600" preserveAspectRatio="xMidYMid meet" overflow="hidden" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe del flujo de citas — escritorio</title>
  <desc id="desc">Cuatro pantallas del flujo de agendamiento de Patitas Felices: mascota y motivo, fecha y hora, datos del tutor y confirmación.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#303638}.muted{fill:#747b7e}.dark{fill:#263234}.white{fill:#fff}
    .screen{fill:#F5F6F6;stroke:#CFD5D6;stroke-width:2}.panel{fill:#fff;stroke:#C7CECF;stroke-width:2}
    .field{fill:#fff;stroke:#ADB6B8;stroke-width:1.5}.button{fill:#DDE2E3;stroke:#586164;stroke-width:1.5}
    .label{font-size:15px;font-weight:700}.body{font-size:17px}.small{font-size:13px}
  </style>
  <rect width="1440" height="3600" fill="#E9ECEC"/>

  <!-- Screen 1: Pet and reason -->
  <g>
    <rect x="0" y="0" width="1440" height="880" class="screen"/>
    <rect x="0" y="0" width="1440" height="76" fill="#fff"/>
    <text x="92" y="48" font-size="21" font-weight="700">PATITAS FELICES</text>
    <text x="1060" y="47" font-size="14" font-weight="700">¿Emergencia? Llamar / WhatsApp</text>
    <line x1="0" y1="76" x2="1440" y2="76" stroke="#C7CECF"/>
    <text x="92" y="112" class="small muted">AGENDAR CITA · PASO 1 DE 3</text>
    <line x1="92" y1="144" x2="1348" y2="144" stroke="#C7CECF" stroke-width="4"/>
    <line x1="92" y1="144" x2="510" y2="144" stroke="#596467" stroke-width="4"/>
    <circle cx="92" cy="144" r="13" fill="#596467"/><circle cx="510" cy="144" r="13" fill="#fff" stroke="#9AA3A5" stroke-width="3"/><circle cx="928" cy="144" r="13" fill="#fff" stroke="#9AA3A5" stroke-width="3"/>
    <text x="92" y="177" class="small" font-weight="700">Mascota y motivo</text><text x="510" y="177" text-anchor="middle" class="small muted">Fecha y hora</text><text x="928" y="177" text-anchor="middle" class="small muted">Tus datos</text>
    <text x="190" y="232" font-size="32" font-weight="700">Cuéntanos sobre tu mascota</text>
    <text x="190" y="263" class="body muted">Así podremos preparar mejor su consulta.</text>
    <rect x="190" y="286" width="760" height="512" rx="12" class="panel"/>
    <text x="222" y="326" class="label">Especie <tspan fill="#555">*</tspan></text>
    <rect x="222" y="340" width="696" height="52" rx="7" class="field"/><text x="242" y="372" class="body muted">Selecciona una especie</text><text x="888" y="372" class="body muted">⌄</text>
    <text x="222" y="429" class="label">Nombre de la mascota <tspan class="muted" font-weight="400">(opcional)</tspan></text>
    <rect x="222" y="443" width="430" height="52" rx="7" class="field"/><text x="242" y="475" class="small muted">Escribe su nombre</text>
    <text x="674" y="429" class="label">Edad <tspan class="muted" font-weight="400">(opcional)</tspan></text>
    <rect x="674" y="443" width="244" height="52" rx="7" class="field"/><text x="694" y="475" class="small muted">Edad y unidad</text><text x="890" y="475" class="small muted">⌄</text>
    <text x="222" y="532" class="label">Motivo de la cita <tspan fill="#555">*</tspan></text>
    <rect x="222" y="546" width="696" height="52" rx="7" class="field"/><text x="242" y="578" class="body muted">Selecciona el motivo</text><text x="888" y="578" class="body muted">⌄</text>
    <text x="222" y="619" font-size="11" class="muted">Consulta · Vacunación · Desparasitación · Peluquería · Evaluación para cirugía · Seguimiento · Otro</text>
    <text x="222" y="655" class="label">Síntomas o condición médica <tspan class="muted" font-weight="400">(opcional)</tspan></text>
    <rect x="222" y="669" width="696" height="76" rx="7" class="field"/><text x="242" y="701" class="small muted">Añade cualquier información que consideres importante</text>
    <text x="222" y="773" font-size="12" class="muted">* Campos obligatorios. Si eliges «Otro», podrás especificar el motivo.</text>
    <rect x="190" y="817" width="152" height="45" rx="8" fill="#fff" stroke="#929B9D" stroke-width="1.5"/><text x="266" y="845" text-anchor="middle" class="small">Cancelar</text>
    <rect x="780" y="817" width="170" height="45" rx="8" class="button"/><text x="865" y="845" text-anchor="middle" class="label">Continuar →</text>
    <rect x="980" y="286" width="270" height="215" rx="12" class="panel"/>
    <text x="1008" y="328" class="label">Una sola clínica</text><text x="1008" y="360" class="small muted">No necesitas elegir una sede.</text><text x="1008" y="384" class="small muted">La dirección y los horarios</text><text x="1008" y="408" class="small muted">se mostrarán al confirmar.</text>
    <line x1="1008" y1="433" x2="1222" y2="433" stroke="#D4D9DA"/><text x="1008" y="466" class="small">¿Es una emergencia?</text><text x="1008" y="488" class="small" font-weight="700">Llamar o escribir ahora →</text>
    <text x="92" y="875" font-size="12" class="muted">WIREFRAME · DESKTOP 1440 PX · 1 / 4</text>
  </g>

