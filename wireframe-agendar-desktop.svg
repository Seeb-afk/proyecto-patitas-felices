  <g transform="translate(0 900)">
    <rect x="0" y="0" width="1440" height="880" class="screen"/>
    <rect x="0" y="0" width="1440" height="76" fill="#fff"/>
    <text x="92" y="48" font-size="21" font-weight="700">PATITAS FELICES</text><text x="1060" y="47" font-size="14" font-weight="700">¿Emergencia? Llamar / WhatsApp</text><line x1="0" y1="76" x2="1440" y2="76" stroke="#C7CECF"/>
    <text x="92" y="112" class="small muted">AGENDAR CITA · PASO 2 DE 3</text><line x1="92" y1="144" x2="1348" y2="144" stroke="#C7CECF" stroke-width="4"/><line x1="92" y1="144" x2="928" y2="144" stroke="#596467" stroke-width="4"/><circle cx="92" cy="144" r="13" fill="#596467"/><circle cx="510" cy="144" r="13" fill="#596467"/><circle cx="928" cy="144" r="13" fill="#fff" stroke="#9AA3A5" stroke-width="3"/>
    <text x="92" y="177" class="small muted">Mascota y motivo</text><text x="510" y="177" text-anchor="middle" class="small" font-weight="700">Fecha y hora</text><text x="928" y="177" text-anchor="middle" class="small muted">Tus datos</text>
    <text x="190" y="232" font-size="32" font-weight="700">Elige fecha y hora</text><text x="190" y="263" class="body muted">Selecciona una opción disponible para tu cita.</text>
    <rect x="190" y="286" width="660" height="510" rx="12" class="panel"/>
    <text x="222" y="330" class="label">Fecha de la cita</text><text x="520" y="330" class="body" font-weight="700">[Mes / año]</text><text x="785" y="330" class="body">‹　›</text>
    <line x1="222" y1="348" x2="818" y2="348" stroke="#D4D9DA"/>
    <g class="small muted" text-anchor="middle"><text x="268" y="381">Lu</text><text x="350" y="381">Ma</text><text x="432" y="381">Mi</text><text x="514" y="381">Ju</text><text x="596" y="381">Vi</text><text x="678" y="381">Sá</text><text x="760" y="381">Do</text></g>
    <g class="small" text-anchor="middle">
      <text x="268" y="425">1</text><text x="350" y="425">2</text><text x="432" y="425">3</text><text x="514" y="425">4</text><text x="596" y="425">5</text><text x="678" y="425">6</text><text x="760" y="425">7</text>
      <text x="268" y="473">8</text><text x="350" y="473">9</text><text x="432" y="473">10</text><text x="514" y="473">11</text><text x="596" y="473">12</text><text x="678" y="473">13</text><text x="760" y="473">14</text>
      <text x="268" y="521">15</text><text x="350" y="521">16</text><text x="432" y="521">17</text><text x="514" y="521">18</text><text x="596" y="521">19</text><text x="678" y="521">20</text><text x="760" y="521">21</text>
      <text x="268" y="569">22</text><text x="350" y="569">23</text><text x="432" y="569">24</text><text x="514" y="569">25</text><text x="596" y="569">26</text><text x="678" y="569">27</text><text x="760" y="569">28</text>
      <text x="268" y="617">29</text><text x="350" y="617">30</text><text x="432" y="617">31</text>
    </g>
    <circle cx="514" cy="563" r="21" fill="#DDE2E3" stroke="#596467" stroke-width="1.5"/>
    <text x="222" y="680" class="small muted">Fechas y horarios de ejemplo; mostrar disponibilidad real.</text>
    <text x="222" y="720" class="small">Fecha seleccionada: <tspan font-weight="700">[día / mes]</tspan></text>
    <rect x="222" y="742" width="160" height="38" rx="7" fill="#DDE2E3"/><text x="302" y="766" text-anchor="middle" class="small" font-weight="700">10:00 a. m.</text>
    <rect x="395" y="742" width="160" height="38" rx="7" class="field"/><text x="475" y="766" text-anchor="middle" class="small">11:30 a. m.</text>
    <rect x="568" y="742" width="160" height="38" rx="7" class="field"/><text x="648" y="766" text-anchor="middle" class="small">2:00 p. m.</text>
    <rect x="890" y="286" width="360" height="290" rx="12" class="panel"/>
    <text x="922" y="328" class="label">Resumen de la cita</text><line x1="922" y1="346" x2="1218" y2="346" stroke="#D4D9DA"/>
    <text x="922" y="382" class="small muted">Mascota</text><text x="922" y="405" class="small">[Especie] · [Nombre si indicado]</text>
    <text x="922" y="445" class="small muted">Motivo</text><text x="922" y="468" class="small">[Motivo seleccionado]</text>
    <text x="922" y="508" class="small muted">Clínica</text><text x="922" y="531" class="small">Patitas Felices · sede única</text>
    <rect x="190" y="817" width="160" height="45" rx="8" fill="#fff" stroke="#929B9D" stroke-width="1.5"/><text x="270" y="845" text-anchor="middle" class="small">← Volver</text>
    <rect x="680" y="817" width="170" height="45" rx="8" class="button"/><text x="765" y="845" text-anchor="middle" class="label">Continuar →</text>
    <text x="92" y="875" font-size="12" class="muted">WIREFRAME · DESKTOP 1440 PX · 2 / 4</text>
  </g>

  <!-- Screen 3: Owner details -->
  <g transform="translate(0 1800)">
    <rect x="0" y="0" width="1440" height="880" class="screen"/><rect x="0" y="0" width="1440" height="76" fill="#fff"/>
    <text x="92" y="48" font-size="21" font-weight="700">PATITAS FELICES</text><text x="1060" y="47" font-size="14" font-weight="700">¿Emergencia? Llamar / WhatsApp</text><line x1="0" y1="76" x2="1440" y2="76" stroke="#C7CECF"/>
    <text x="92" y="112" class="small muted">AGENDAR CITA · PASO 3 DE 3</text><line x1="92" y1="144" x2="1348" y2="144" stroke="#596467" stroke-width="4"/><circle cx="92" cy="144" r="13" fill="#596467"/><circle cx="510" cy="144" r="13" fill="#596467"/><circle cx="928" cy="144" r="13" fill="#596467"/>
    <text x="92" y="177" class="small muted">Mascota y motivo</text><text x="510" y="177" text-anchor="middle" class="small muted">Fecha y hora</text><text x="928" y="177" text-anchor="middle" class="small" font-weight="700">Tus datos</text>
    <text x="190" y="232" font-size="32" font-weight="700">¿Cómo podemos contactarte?</text><text x="190" y="263" class="body muted">Revisa los datos antes de confirmar tu cita.</text>
    <rect x="190" y="286" width="650" height="390" rx="12" class="panel"/>
    <text x="222" y="329" class="label">Nombre completo <tspan fill="#555">*</tspan></text><rect x="222" y="343" width="586" height="54" rx="7" class="field"/><text x="242" y="376" class="small muted">Escribe tu nombre</text>
    <text x="222" y="435" class="label">Teléfono <tspan fill="#555">*</tspan></text><rect x="222" y="449" width="586" height="54" rx="7" class="field"/><text x="242" y="482" class="small muted">Número para confirmar o aclarar la cita</text>
    <text x="222" y="540" class="small muted">No necesitas crear una cuenta ni proporcionar correo.</text>
    <line x1="222" y1="563" x2="808" y2="563" stroke="#D4D9DA"/><text x="222" y="598" class="small">* Datos obligatorios</text>
    <text x="222" y="638" font-size="12" class="muted">Aviso de privacidad: texto pendiente de validación con la clínica.</text>
    <rect x="880" y="286" width="370" height="390" rx="12" class="panel"/>
    <text x="912" y="329" class="label">Revisa tu cita</text><line x1="912" y1="347" x2="1218" y2="347" stroke="#D4D9DA"/>
